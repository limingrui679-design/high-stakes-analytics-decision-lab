name: Demo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "demo/**"
      - "examples/real-data-cases/figures/**"
      - "pages/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish interactive explorer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the bounded site artifact
        run: |
          mkdir -p _site/demo _site/examples/real-data-cases/figures
          cp pages/index.html _site/index.html
          cp -R demo/. _site/demo/
          cp -R examples/real-data-cases/figures/. _site/examples/real-data-cases/figures/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
