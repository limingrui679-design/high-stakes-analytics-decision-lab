name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standalone verification suite
        run: python -m unittest discover -s tests -v

  quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install quality tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run Ruff
        run: >-
          ruff check scripts tests
          examples/real-data-cases/projects/_shared/safe_external_io.py
      - name: Run mypy
        run: mypy scripts
      - name: Check prose and identifiers
        run: >-
          codespell --config .codespellrc
          README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md VERSIONING.md
          demo docs references scripts skills tests

  portfolio-reproducibility:
    name: Portfolio rebuild ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rebuild and compare all fifteen projects
        run: python scripts/verify_portfolio_reproducibility.py

  source-builder-security:
    name: Source builder security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install hardened XML parser
        run: python -m pip install defusedxml==0.7.1
      - name: Run source-builder security tests
        run: >-
          python -m unittest discover -s tests
          -p 'test_reproducibility_and_source_security.py' -v

  targeted-coverage:
    name: Privacy and source-builder coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install coverage and hardened XML parser
        run: python -m pip install coverage==7.15.4 defusedxml==0.7.1
      - name: Measure branch coverage for hardened input paths
        run: >-
          coverage run --branch
          --include='scripts/data_quality.py,scripts/build_tailored_source_snapshots.py,examples/real-data-cases/projects/_shared/safe_external_io.py'
          -m unittest tests.test_data_quality
          tests.test_reproducibility_and_source_security -v
      - name: Enforce targeted coverage floor
        run: >-
          coverage report --show-missing --fail-under=70
          --include='scripts/data_quality.py,scripts/build_tailored_source_snapshots.py,examples/real-data-cases/projects/_shared/safe_external_io.py'

  security-audit:
    name: Dependency and code security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-maintenance.txt
            requirements-security.txt
      - name: Install security tools
        run: python -m pip install --requirement requirements-security.txt
      - name: Reject medium- and high-severity code findings
        run: >-
          bandit -r scripts examples/real-data-cases/projects/_shared -ll
      - name: Audit pinned maintenance dependencies
        run: >-
          pip-audit -r requirements-dev.txt -r requirements-maintenance.txt
          -r requirements-security.txt
          --progress-spinner off
