<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Constraint risk boundary</title>
<desc id="desc">Interval markers compare each alternative&#x27;s observed constraint-breach rate and one-sided 95 percent upper bound with the configured risk tolerance.</desc>
<defs>
  <pattern id="headerGrid" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r=".85" fill="#FFFFFF" opacity=".12"/>
  </pattern>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .kicker { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; }
  .title { font-size: 28px; font-weight: 780; letter-spacing: -0.35px; }
  .subtitle { font-size: 14px; }
  .section { fill: #0B1324; font-size: 17px; font-weight: 720; }
  .label { fill: #263449; font-size: 14px; }
  .small { fill: #617084; font-size: 12px; }
  .eyebrow { fill: #617084; font-size: 10.5px; font-weight: 800; letter-spacing: 1px; }
  .value { fill: #0B1324; font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .big { fill: #0B1324; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .display { fill: #0B1324; font-size: 38px; font-weight: 820; font-variant-numeric: tabular-nums; }
  .mono { fill: #263449; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; font-weight: 760; letter-spacing: .25px; }
  .footnote { fill: #8B98A9; font-size: 10.5px; }
  .micro { fill: #8B98A9; font-size: 8.5px; font-weight: 800; letter-spacing: 1px; }
</style>
<rect width="1200" height="450" fill="#EEF3F8"/>
<circle cx="1180" cy="420" r="120" fill="#7257D9" opacity=".035"/>
<circle cx="36" cy="445" r="86" fill="#7257D9" opacity=".025"/>
