<text x="1158.0" y="432.0" class="footnote" text-anchor="end">Synthetic demonstration · values shown directly</text>
<text x="600.0" y="432.0" class="micro" text-anchor="middle" style="fill:#8B98A9">HIGH-STAKES ANALYTICS &amp; DECISION LAB · EDITORIAL EVIDENCE SYSTEM</text>
