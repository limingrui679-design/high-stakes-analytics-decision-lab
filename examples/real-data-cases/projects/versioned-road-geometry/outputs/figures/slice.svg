<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 158" role="img" aria-labelledby="t d">
<title id="t">Consequences of indexing only edited ways</title><desc id="d">A moved node can change its referencing road even without a new way version.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="sans-serif" fill="#172d43">
<text x="16" y="25" font-size="18" font-weight="bold">Consequences of indexing only edited ways</text>
<text x="16" y="47" font-size="13">Incorrect geometry-version pairs</text>
<path d="M 237.00 55 V 139" stroke="#8495a3"/>
<text x="16" y="77" font-size="13">Direct edits only</text>
<rect x="237.00" y="62" width="420.00" height="18" fill="#166c77"/>
<text x="683" y="77" font-size="14">1.000</text>
<text x="16" y="111" font-size="13">Reverse dependency closure</text>
<rect x="237.00" y="96" width="0.00" height="18" fill="#166c77"/>
<text x="683" y="111" font-size="14">0.000</text>
</g></svg>
