<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 226" role="img" aria-labelledby="t d">
<title id="t">Commit and interruption checks</title><desc id="d">Reader snapshot checks span the commit. The writer-exit trial deliberately leaves a transaction uncommitted.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="sans-serif" fill="#172d43">
<text x="16" y="25" font-size="18" font-weight="bold">Commit and interruption checks</text>
<text x="16" y="47" font-size="13">Completed checks</text>
<path d="M 237.00 55 V 207" stroke="#8495a3"/>
<text x="16" y="77" font-size="13">Pinned readers</text>
<rect x="237.00" y="62" width="420.00" height="18" fill="#166c77"/>
<text x="683" y="77" font-size="14">29.000</text>
<text x="16" y="111" font-size="13">Duplicate replays</text>
<rect x="237.00" y="96" width="420.00" height="18" fill="#166c77"/>
<text x="683" y="111" font-size="14">29.000</text>
<text x="16" y="145" font-size="13">Rollback and reopen</text>
<rect x="237.00" y="130" width="28.97" height="18" fill="#166c77"/>
<text x="683" y="145" font-size="14">2.000</text>
<text x="16" y="179" font-size="13">Writer process exits</text>
<rect x="237.00" y="164" width="14.48" height="18" fill="#166c77"/>
<text x="683" y="179" font-size="14">1.000</text>
</g></svg>
