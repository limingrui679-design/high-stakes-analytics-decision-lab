<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="454" viewBox="0 0 1200 454" role="img" aria-labelledby="title desc">
<title id="title">Utility uncertainty and downside</title>
<desc id="desc">Dot and interval plot comparing P05 to P95 utility, expected utility, and the average of the worst ten percent of simulated outcomes.</desc>
<defs>
