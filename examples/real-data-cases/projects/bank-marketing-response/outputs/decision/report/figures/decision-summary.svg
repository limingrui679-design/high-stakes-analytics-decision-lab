<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Decision outcome and evidence</title>
<desc id="desc">A decision banner states the evidence-matched terminal decision. Three metric cards summarize the reviewed evidence and a claim boundary limits interpretation.</desc>
<defs>
  <pattern id="headerGrid" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r=".85" fill="#FFFFFF" opacity=".12"/>
  </pattern>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .kicker { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; }
  .title { font-size: 28px; font-weight: 780; letter-spacing: -0.35px; }
  .subtitle { font-size: 14px; }
  .section { fill: #0B1324; font-size: 17px; font-weight: 720; }
  .label { fill: #263449; font-size: 14px; }
  .small { fill: #617084; font-size: 12px; }
  .eyebrow { fill: #617084; font-size: 10.5px; font-weight: 800; letter-spacing: 1px; }
  .value { fill: #0B1324; font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .big { fill: #0B1324; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .display { fill: #0B1324; font-size: 38px; font-weight: 820; font-variant-numeric: tabular-nums; }
  .mono { fill: #263449; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; font-weight: 760; letter-spacing: .25px; }
  .footnote { fill: #8B98A9; font-size: 10.5px; }
  .micro { fill: #8B98A9; font-size: 8.5px; font-weight: 800; letter-spacing: 1px; }
</style>
<rect width="1200" height="520" fill="#EEF3F8"/>
<circle cx="1180" cy="490" r="120" fill="#B9487C" opacity=".035"/>
<circle cx="36" cy="515" r="86" fill="#B9487C" opacity=".025"/>
<rect width="1200" height="118" fill="#0B1F3A"/>
<rect width="1200" height="118" fill="url(#headerGrid)"/>
<rect width="10" height="118" fill="#B9487C"/>
<rect x="34" y="19" width="4" height="16" rx="2" fill="#B9487C"/>
<text x="48.0" y="31.0" class="kicker" text-anchor="start" style="fill:#B9487C">EVIDENCE-MATCHED DECISION</text>
<text x="42.0" y="68.0" class="title" text-anchor="start" style="fill:#FFFFFF">Decision outcome and evidence</text>
<text x="42.0" y="96.0" class="subtitle" text-anchor="start" style="fill:#C7D4E4">Bank Marketing · final source-order holdout · 8,238 contacts</text>
<rect x="933" y="20" width="139" height="24" rx="12" fill="#13345B" stroke="#36516F"/>
<text x="1002.5" y="36.0" class="micro" text-anchor="middle" style="fill:#AFC0D3">MODEL-BOUND EVIDENCE</text>
<circle cx="1125" cy="58" r="31" fill="none" stroke="#B9487C" stroke-width="2"/>
<circle cx="1125" cy="58" r="10" fill="#B9487C"/>
<circle cx="1125" cy="58" r="52" fill="none" stroke="#49627F" stroke-width="1" opacity=".7"/>
<line x1="1065" y1="58" x2="1185" y2="58" stroke="#49627F" stroke-width="1"/>
<line x1="1125" y1="5" x2="1125" y2="111" stroke="#49627F" stroke-width="1"/>
<rect x="42.0" y="140.0" width="1116.0" height="132.0" rx="16" fill="#F9E6EF" stroke="#B9487C" stroke-width="1.5"/>
<text x="68.0" y="170.0" class="eyebrow" text-anchor="start" style="fill:#8C2E5B">TERMINAL DECISION</text>
<text x="68.0" y="205.0" class="section" text-anchor="start" style="fill:#0B1324">Advance the 5% review-capacity rule only to a randomized campaign pilot; do</text>
<text x="68.0" y="229.0" class="section" text-anchor="start" style="fill:#0B1324">not treat observational response concentration as causal lift.</text>
<text x="1132.0" y="169.0" class="eyebrow" text-anchor="end" style="fill:#8C2E5B">PILOT REQUIRED</text>
<rect x="44.0" y="306.0" width="352.0" height="118.0" rx="14" fill="#07152A" opacity=".055"/><rect x="42.0" y="300.0" width="352.0" height="118.0" rx="14" fill="#FFFFFF" stroke="#B9C6D5" stroke-width="1"/>
<text x="64.0" y="329.0" class="eyebrow" text-anchor="start">UNTOUCHED-TEST AUC</text>
<text x="64.0" y="371.0" class="big" text-anchor="start" style="fill:#0B1324">0.650</text>
<text x="64.0" y="397.0" class="small" text-anchor="start" style="fill:#617084">Weak-to-moderate ranking performance.</text>
<rect x="426.0" y="306.0" width="352.0" height="118.0" rx="14" fill="#07152A" opacity=".055"/><rect x="424.0" y="300.0" width="352.0" height="118.0" rx="14" fill="#FFFFFF" stroke="#B9C6D5" stroke-width="1"/>
<text x="446.0" y="329.0" class="eyebrow" text-anchor="start">TOP-5% RESPONSE CAPTURE</text>
<text x="446.0" y="371.0" class="big" text-anchor="start" style="fill:#0B1324">7.4%</text>
<text x="446.0" y="397.0" class="small" text-anchor="start" style="fill:#617084">Share of observed responders in the selected</text>
<text x="446.0" y="412.0" class="small" text-anchor="start" style="fill:#617084">tier.</text>
<rect x="808.0" y="306.0" width="352.0" height="118.0" rx="14" fill="#07152A" opacity=".055"/><rect x="806.0" y="300.0" width="352.0" height="118.0" rx="14" fill="#FFFFFF" stroke="#B9C6D5" stroke-width="1"/>
<text x="828.0" y="329.0" class="eyebrow" text-anchor="start">TOP-5% P(BEST)</text>
<text x="828.0" y="371.0" class="big" text-anchor="start" style="fill:#0B1324">59.0%</text>
<text x="828.0" y="397.0" class="small" text-anchor="start" style="fill:#617084">Shared-block uncertainty across capacity</text>
<text x="828.0" y="412.0" class="small" text-anchor="start" style="fill:#617084">options.</text>
<text x="48.0" y="458.0" class="small" text-anchor="start" style="fill:#8B98A9">Claim boundary: Response prediction on observational campaign records is not an estimate of causal lift, profit, or customer</text>
<text x="48.0" y="474.0" class="small" text-anchor="start" style="fill:#8B98A9">lifetime value.</text>
<line x1="36" y1="480.0" x2="1164" y2="480.0" stroke="#D9E2EC" stroke-width="1"/>
<text x="42.0" y="502.0" class="footnote" text-anchor="start">Source: UCI Machine Learning Repository; project outputs/results.json</text>
<text x="1158.0" y="502.0" class="footnote" text-anchor="end">Real-data project · terminal decision shown directly</text>
<text x="600.0" y="502.0" class="micro" text-anchor="middle" style="fill:#8B98A9">HIGH-STAKES ANALYTICS &amp; DECISION LAB · EDITORIAL EVIDENCE SYSTEM</text>
</svg>
