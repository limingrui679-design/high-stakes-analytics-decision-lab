<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="466" viewBox="0 0 1200 466" role="img" aria-labelledby="title desc">
<title id="title">Criterion trade-off profile</title>
<desc id="desc">A directly labeled scorecard compares normalized criterion values and weights for each alternative, with the preferred option outlined.</desc>
<defs>
  <pattern id="headerGrid" width="22" height="22" patternUnits="userSpaceOnUse">
