<g font-family="sans-serif" fill="#172d43">
<text x="16" y="25" font-size="18" font-weight="bold">Historical stages of delivery delay</text>
<text x="16" y="47" font-size="13">Single-item orders</text>
<path d="M 237.00 55 V 207" stroke="#8495a3"/>
<text x="16" y="77" font-size="13">handoff 0, delivery 0</text>
<rect x="237.00" y="62" width="420.00" height="18" fill="#166c77"/>
<text x="683" y="77" font-size="14">74,726.000</text>
<text x="16" y="111" font-size="13">handoff 0, delivery 1</text>
<rect x="237.00" y="96" width="24.76" height="18" fill="#166c77"/>
<text x="683" y="111" font-size="14">4,405.000</text>
<text x="16" y="145" font-size="13">handoff 1, delivery 0</text>
