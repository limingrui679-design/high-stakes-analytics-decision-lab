<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 226" role="img" aria-labelledby="t d">
<title id="t">Late deliveries after on-time handoff</title><desc id="d">This decomposition identifies the timing of a delay, not the responsible party.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="sans-serif" fill="#172d43">
<text x="16" y="25" font-size="18" font-weight="bold">Late deliveries after on-time handoff</text>
<text x="16" y="47" font-size="13">Per 100 review slots</text>
<path d="M 237.00 55 V 207" stroke="#8495a3"/>
<text x="16" y="77" font-size="13">Order volume</text>
<rect x="237.00" y="62" width="237.07" height="18" fill="#166c77"/>
<text x="683" y="77" font-size="14">6.350</text>
<text x="16" y="111" font-size="13">Overall lateness</text>
<rect x="237.00" y="96" width="207.20" height="18" fill="#166c77"/>
<text x="683" y="111" font-size="14">5.550</text>
<text x="16" y="145" font-size="13">Case-adjusted handoff</text>
<rect x="237.00" y="130" width="218.40" height="18" fill="#166c77"/>
<text x="683" y="145" font-size="14">5.850</text>
<text x="16" y="179" font-size="13">Post-handoff delay</text>
<rect x="237.00" y="164" width="420.00" height="18" fill="#166c77"/>
<text x="683" y="179" font-size="14">11.250</text>
</g></svg>
