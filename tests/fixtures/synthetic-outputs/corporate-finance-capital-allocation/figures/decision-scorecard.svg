<text x="42.0" y="66.0" class="title" text-anchor="start" style="fill:#FFFFFF">Decision summary</text>
<text x="42.0" y="93.0" class="subtitle" text-anchor="start" style="fill:#C7D4E4">One answer, four diagnostics, and the risk boundary that governs feasibility</text>
