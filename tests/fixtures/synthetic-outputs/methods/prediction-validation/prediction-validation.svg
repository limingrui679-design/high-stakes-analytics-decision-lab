<rect x="806.0" y="246.0" width="330.0" height="94.0" rx="14" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1"/>
<text x="824.0" y="271.0" class="eyebrow" text-anchor="start">THRESHOLD</text>
