<text x="42.0" y="66.0" class="title" text-anchor="start" style="fill:#FFFFFF">Prediction Model Validation</text>
<text x="42.0" y="93.0" class="subtitle" text-anchor="start" style="fill:#C7D4E4">Reliability, discrimination, calibration, threshold performance, subgroup error, and drift</text>
