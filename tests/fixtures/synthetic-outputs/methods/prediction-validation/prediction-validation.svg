<rect x="454.0" y="370.0" width="682.0" height="166.0" rx="16" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/>
<text x="476.0" y="399.0" class="eyebrow" text-anchor="start" style="fill:#7257D9">DEPLOYMENT DIAGNOSTICS</text>
<text x="476.0" y="438.0" class="display" text-anchor="start" style="fill:#FFFFFF">3</text>
<text x="520.0" y="438.0" class="label" text-anchor="start" style="fill:#C7D4E4">subgroups reviewed</text>
<text x="476.0" y="472.0" class="section" text-anchor="start" style="fill:#FFFFFF">FPR range gap 0.0%</text>
<text x="476.0" y="500.0" class="section" text-anchor="start" style="fill:#FFFFFF">FNR range gap 16.7%</text>
<text x="902.0" y="438.0" class="display" text-anchor="middle" style="fill:#FFFFFF">1.093</text>
<text x="902.0" y="466.0" class="label" text-anchor="middle" style="fill:#C7D4E4">score PSI</text>
<text x="902.0" y="494.0" class="small" text-anchor="middle" style="fill:#C7D4E4">PSI is a descriptive</text>
<text x="902.0" y="510.0" class="small" text-anchor="middle" style="fill:#C7D4E4">score-distribution diagnostic;</text>
<text x="902.0" y="526.0" class="small" text-anchor="middle" style="fill:#C7D4E4">investigate data, label, population,</text>
<text x="902.0" y="542.0" class="small" text-anchor="middle" style="fill:#C7D4E4">and policy changes before attributing</text>
<text x="902.0" y="558.0" class="small" text-anchor="middle" style="fill:#C7D4E4">a cause.</text>
<text x="239.0" y="526.0" class="small" text-anchor="middle">Mean predicted probability</text>
<text x="64.0" y="327.0" class="small" text-anchor="middle" transform="rotate(-90 64 327.0)">Observed event rate</text>
