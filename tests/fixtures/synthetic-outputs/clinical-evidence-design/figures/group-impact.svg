<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="546" viewBox="0 0 1200 546" role="img" aria-labelledby="title desc">
<title id="title">Distributional impact screen</title>
<desc id="desc">A directly labeled scorecard compares supplied group parity ratios, distance from parity, and a review reference without treating similarity as proof of fairness.</desc>
