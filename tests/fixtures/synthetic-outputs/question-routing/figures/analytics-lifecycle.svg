<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Question-to-analysis routing blueprint</title>
<desc id="desc">A three-stage analytics workflow moves from descriptive evidence to predictive estimates and prescriptive decisions, with an optional diagnostic bridge.</desc>
<rect width="1400" height="720" rx="22" fill="#F3F6FA"/><rect width="1400" height="180" rx="22" fill="#0B1F3A"/><rect y="158" width="1400" height="22" fill="#0B1F3A"/><rect width="10" height="180" fill="#00A69A"/><text x="48" y="42" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="11" font-weight="800" fill="#00A69A" text-anchor="start">ANALYTICS ROUTER · EXECUTIVE BLUEPRINT</text><text x="48" y="86" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="34" font-weight="780" fill="#FFFFFF" text-anchor="start">One question. Three evidence lenses. One decision path.</text><text x="48" y="123" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="16" font-weight="400" fill="#C7D4E4" text-anchor="start">“How should a city allocate next year&#x27;s limited screening capacity across fixed clinics,</text><text x="48" y="146" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="16" font-weight="400" fill="#C7D4E4" text-anchor="start">mobile units, and a targeted hybrid while improving access and staying within budget?”</text><rect x="1120" y="42" width="228" height="78" rx="14" fill="#13345B" stroke="#31516F"/><text x="1140" y="68" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="10" font-weight="800" fill="#8EA5BD" text-anchor="start">PRIMARY MODE</text><text x="1140" y="99" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="19" font-weight="760" fill="#FFFFFF" text-anchor="start">Prescriptive analytics</text><circle cx="1313" cy="81" r="16" fill="#00A69A"/><path d="M 1306 81 L 1311 86 L 1321 75" fill="none" stroke="#0B1F3A" stroke-width="2.5"/><rect x="48" y="216" width="402" height="284" rx="18" fill="#FFFFFF" stroke="#00A69A" stroke-width="2.5"/><rect x="48" y="216" width="8" height="284" rx="4" fill="#00A69A"/><circle cx="96" cy="264" r="24" fill="#00A69A"/><text x="96" y="270" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">01</text><text x="134" y="258" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="800" fill="#00A69A" text-anchor="start">DESCRIPTIVE</text><text x="134" y="282" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#617084" text-anchor="start">Observed evidence</text><text x="73" y="340" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="22" font-weight="760" fill="#0B1324" text-anchor="start">What is happening?</text><rect x="73" y="367" width="352" height="48" rx="9" fill="#DDF5F2"/><text x="90" y="397" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="13" font-weight="680" fill="#0B1324" text-anchor="start">Baseline · trend · segments</text><text x="73" y="446" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="9" font-weight="800" fill="#617084" text-anchor="start">COMPLETION GATE</text><text x="73" y="474" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="13" font-weight="720" fill="#00A69A" text-anchor="start">Required in this path</text><circle cx="420" cy="467" r="9" fill="#00A69A" stroke="#00A69A"/><path d="M 416 467 L 419 471 L 425 463" fill="none" stroke="#FFFFFF" stroke-width="1.6"/><line x1="458" y1="356" x2="478" y2="356" stroke="#9CB0C5" stroke-width="2"/><path d="M 473 350 L 482 356 L 473 362" fill="none" stroke="#9CB0C5" stroke-width="2"/><rect x="488" y="216" width="402" height="284" rx="18" fill="#FFFFFF" stroke="#8168E8" stroke-width="2.5"/><rect x="488" y="216" width="8" height="284" rx="4" fill="#8168E8"/><circle cx="536" cy="264" r="24" fill="#8168E8"/><text x="536" y="270" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">02</text><text x="574" y="258" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="800" fill="#8168E8" text-anchor="start">PREDICTIVE</text><text x="574" y="282" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#617084" text-anchor="start">Modeled evidence</text><text x="513" y="340" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="22" font-weight="760" fill="#0B1324" text-anchor="start">What may happen next?</text><rect x="513" y="367" width="352" height="48" rx="9" fill="#EEEAFE"/><text x="530" y="397" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="13" font-weight="680" fill="#0B1324" text-anchor="start">Forecast · calibration · risk</text><text x="513" y="446" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="9" font-weight="800" fill="#617084" text-anchor="start">COMPLETION GATE</text><text x="513" y="474" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="13" font-weight="720" fill="#8168E8" text-anchor="start">Required in this path</text><circle cx="860" cy="467" r="9" fill="#8168E8" stroke="#8168E8"/><path d="M 856 467 L 859 471 L 865 463" fill="none" stroke="#FFFFFF" stroke-width="1.6"/><line x1="898" y1="356" x2="918" y2="356" stroke="#9CB0C5" stroke-width="2"/><path d="M 913 350 L 922 356 L 913 362" fill="none" stroke="#9CB0C5" stroke-width="2"/><rect x="928" y="216" width="402" height="284" rx="18" fill="#FFFFFF" stroke="#E0AA2B" stroke-width="2.5"/><rect x="928" y="216" width="8" height="284" rx="4" fill="#E0AA2B"/><circle cx="976" cy="264" r="24" fill="#E0AA2B"/><text x="976" y="270" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">03</text><text x="1014" y="258" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="800" fill="#E0AA2B" text-anchor="start">PRESCRIPTIVE</text><text x="1014" y="282" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#617084" text-anchor="start">Decision layer</text><text x="953" y="340" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="22" font-weight="760" fill="#0B1324" text-anchor="start">What should be done?</text><rect x="953" y="367" width="352" height="48" rx="9" fill="#FFF2C7"/><text x="970" y="397" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="13" font-weight="680" fill="#0B1324" text-anchor="start">Options · constraints · values</text><text x="953" y="446" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="9" font-weight="800" fill="#617084" text-anchor="start">COMPLETION GATE</text><text x="953" y="474" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="13" font-weight="720" fill="#E0AA2B" text-anchor="start">Required in this path</text><circle cx="1300" cy="467" r="9" fill="#E0AA2B" stroke="#E0AA2B"/><path d="M 1296 467 L 1299 471 L 1305 463" fill="none" stroke="#FFFFFF" stroke-width="1.6"/><rect x="48" y="536" width="1304" height="110" rx="15" fill="#FFFFFF" stroke="#D9E2EC"/><rect x="48" y="536" width="8" height="110" rx="4" fill="#E06950"/><text x="76" y="567" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="10" font-weight="800" fill="#B34E39" text-anchor="start">OPTIONAL DIAGNOSTIC BRIDGE</text><text x="76" y="601" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="19" font-weight="740" fill="#0B1324" text-anchor="start">Why did the pattern occur?</text><text x="395" y="590" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="14" font-weight="400" fill="#617084" text-anchor="start">Decomposition and root-cause hypotheses may guide investigation.</text><text x="395" y="614" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="14" font-weight="650" fill="#B34E39" text-anchor="start">A causal claim still requires an identification strategy.</text><rect x="1068" y="558" width="252" height="52" rx="12" fill="#FCE7E2"/><text x="1194" y="580" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="9" font-weight="800" fill="#A63C2A" text-anchor="middle">DO NOT SKIP</text><text x="1194" y="600" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="12" font-weight="700" fill="#A63C2A" text-anchor="middle">causal-evidence guardrail</text><line x1="48" y1="678" x2="1352" y2="678" stroke="#D9E2EC"/><text x="48" y="703" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="11" font-weight="400" fill="#617084" text-anchor="start">No data supplied → blueprint only · no empirical finding · no forecast · no recommendation</text><text x="1352" y="703" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif" font-size="11" font-weight="400" fill="#8B98A9" text-anchor="end">Source: routing blueprint JSON</text>
