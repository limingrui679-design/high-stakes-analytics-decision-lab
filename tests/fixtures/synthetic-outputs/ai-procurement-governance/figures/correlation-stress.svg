<text x="58.0" y="169.0" class="eyebrow" text-anchor="start">INDEPENDENT</text>
<text x="58.0" y="194.0" class="small" text-anchor="start">No shared residual shocks</text>
<text x="58.0" y="228.0" class="section" text-anchor="start">Auditable model with human</text>
<text x="58.0" y="248.0" class="section" text-anchor="start">review</text>
<text x="58.0" y="294.0" class="eyebrow" text-anchor="start">P(BEST)</text>
<text x="362.0" y="298.0" class="value" text-anchor="end">57%</text>
<rect x="58.0" y="310.0" width="304.0" height="10.0" rx="5.0" fill="#E8EDF3"/>
<rect x="58.0" y="310.0" width="173.5" height="10.0" rx="5.0" fill="#246BFD"/>
<text x="58.0" y="356.0" class="eyebrow" text-anchor="start">CVaR10</text>
<text x="362.0" y="358.0" class="value" text-anchor="end">0.645</text>
<text x="58.0" y="397.0" class="eyebrow" text-anchor="start">BREACH U95</text>
