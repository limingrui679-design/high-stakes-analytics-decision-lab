<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Correlation and tail-risk stress</title>
<desc id="desc">Three directly labeled panels compare the preferred option, probability of being best, worst-decile utility, and constraint upper bound under independent, declared correlated, and correlation-stress simulations.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .kicker { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; }
  .title { font-size: 27px; font-weight: 760; letter-spacing: -0.2px; }
  .subtitle { font-size: 14px; }
  .section { fill: #0B1324; font-size: 17px; font-weight: 720; }
  .label { fill: #263449; font-size: 14px; }
  .small { fill: #617084; font-size: 12px; }
  .eyebrow { fill: #617084; font-size: 10.5px; font-weight: 800; letter-spacing: 1px; }
  .value { fill: #0B1324; font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .big { fill: #0B1324; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .display { fill: #0B1324; font-size: 38px; font-weight: 820; font-variant-numeric: tabular-nums; }
  .mono { fill: #263449; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; font-weight: 760; letter-spacing: .25px; }
  .footnote { fill: #8B98A9; font-size: 10.5px; }
</style>
<rect width="1200" height="580" fill="#F3F6FA"/>
<rect width="1200" height="112" fill="#0B1F3A"/>
<rect width="10" height="112" fill="#246BFD"/>
<text x="42.0" y="32.0" class="kicker" text-anchor="start" style="fill:#246BFD">DECISION INTELLIGENCE</text>
<text x="42.0" y="66.0" class="title" text-anchor="start" style="fill:#FFFFFF">Correlation and tail-risk stress</text>
<text x="42.0" y="93.0" class="subtitle" text-anchor="start" style="fill:#C7D4E4">Independent residuals are compared with declared shared shocks and stronger dependence</text>
<circle cx="1122" cy="56" r="28" fill="none" stroke="#246BFD" stroke-width="2"/>
<circle cx="1122" cy="56" r="9" fill="#246BFD"/>
