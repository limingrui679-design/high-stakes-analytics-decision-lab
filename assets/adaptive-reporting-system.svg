<text x="48.0" y="31.0" class="kicker" text-anchor="start" style="fill:#7257D9">ADAPTIVE ANALYTICS ARCHITECTURE</text>
<text x="42.0" y="68.0" class="title" text-anchor="start" style="fill:#FFFFFF">Adaptive reporting is a routing system, not a fixed template</text>
<text x="42.0" y="96.0" class="subtitle" text-anchor="start" style="fill:#C7D4E4">Stable evidence discipline; case-specific fields, methods, figures, and terminal status</text>
<rect x="933" y="20" width="139" height="24" rx="12" fill="#13345B" stroke="#36516F"/>
<text x="1002.5" y="36.0" class="micro" text-anchor="middle" style="fill:#AFC0D3">MODEL-BOUND EVIDENCE</text>
