<rect x="487.0" y="344.0" width="108.0" height="29.0" rx="14" fill="#13345B" stroke="#36516F" stroke-width="1"/>
<text x="541.0" y="363.0" class="micro" text-anchor="middle" style="fill:#C69214">DIAGNOSE</text>
<rect x="365.0" y="387.0" width="108.0" height="29.0" rx="14" fill="#13345B" stroke="#36516F" stroke-width="1"/>
<text x="419.0" y="406.0" class="micro" text-anchor="middle" style="fill:#7257D9">PREDICT</text>
<rect x="487.0" y="387.0" width="108.0" height="29.0" rx="14" fill="#13345B" stroke="#36516F" stroke-width="1"/>
