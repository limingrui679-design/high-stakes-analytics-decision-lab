<rect x="674" y="144" width="8" height="142" rx="4" fill="#008C82"/>
<text x="704.0" y="177.0" class="kicker" text-anchor="start" style="fill:#008C82">PRIMARY OUTPUT</text>
<text x="704.0" y="211.0" class="big" text-anchor="start" style="fill:#0B1324">Evidence Intelligence Report</text>
<text x="704.0" y="241.0" class="label" text-anchor="start" style="fill:#263449">Case-specific methods · interleaved figures · claim boundary</text>
<rect x="676.0" y="322.0" width="488.0" height="146.0" rx="20" fill="#07152A" opacity=".055"/><rect x="674.0" y="316.0" width="488.0" height="146.0" rx="20" fill="#FFFFFF" stroke="#B9C6D5" stroke-width="1"/>
<rect x="674" y="316" width="8" height="146" rx="4" fill="#C69214"/>
<text x="704.0" y="349.0" class="kicker" text-anchor="start" style="fill:#C69214">CONDITIONAL OUTPUT</text>
<text x="704.0" y="383.0" class="big" text-anchor="start" style="fill:#0B1324">Decision Intelligence Brief</text>
<text x="704.0" y="413.0" class="label" text-anchor="start" style="fill:#263449">Evidence gates · dependent shocks · reversal conditions</text>
