<text x="64.0" y="548.0" class="micro" text-anchor="start" style="fill:#0B1F3A">BASELINE</text>
<text x="64.0" y="571.0" class="small" text-anchor="start" style="fill:#263449">What is happening</text>
<text x="331.0" y="548.0" class="micro" text-anchor="start" style="fill:#0B1F3A">VALIDATION</text>
<text x="331.0" y="571.0" class="small" text-anchor="start" style="fill:#263449">What may happen</text>
<text x="598.0" y="548.0" class="micro" text-anchor="start" style="fill:#0B1F3A">BOUNDED ACTION</text>
