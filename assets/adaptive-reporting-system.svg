<text x="78.0" y="221.0" class="micro" text-anchor="middle" style="fill:#246BFD">01</text>
<text x="108.0" y="214.0" class="section" text-anchor="start" style="fill:#0B1324">Question</text>
<text x="108.0" y="237.0" class="small" text-anchor="start" style="fill:#617084">What must be learned or decided?</text>
<circle cx="78" cy="293" r="17" fill="#E8F0FF"/>
<text x="78.0" y="297.0" class="micro" text-anchor="middle" style="fill:#246BFD">02</text>
<text x="108.0" y="290.0" class="section" text-anchor="start" style="fill:#0B1324">Evidence</text>
<text x="108.0" y="313.0" class="small" text-anchor="start" style="fill:#617084">Grain · time · source · quality</text>
<circle cx="78" cy="369" r="17" fill="#E8F0FF"/>
<text x="78.0" y="373.0" class="micro" text-anchor="middle" style="fill:#246BFD">03</text>
<text x="108.0" y="366.0" class="section" text-anchor="start" style="fill:#0B1324">Maturity</text>
<text x="108.0" y="389.0" class="small" text-anchor="start" style="fill:#617084">Explore · validate · pilot · stop</text>
<rect x="338.0" y="172.0" width="294.0" height="262.0" rx="22" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/>
<text x="365.0" y="208.0" class="kicker" text-anchor="start" style="fill:#008C82">ADAPTIVE ROUTER</text>
<text x="365.0" y="245.0" class="big" text-anchor="start" style="fill:#FFFFFF">Route before format</text>
<text x="365.0" y="278.0" class="label" text-anchor="start" style="fill:#D4DFEC">Select only the descriptive,</text>
<text x="365.0" y="298.0" class="label" text-anchor="start" style="fill:#D4DFEC">diagnostic, predictive, and</text>
<text x="365.0" y="318.0" class="label" text-anchor="start" style="fill:#D4DFEC">prescriptive work the evidence</text>
<text x="365.0" y="338.0" class="label" text-anchor="start" style="fill:#D4DFEC">supports.</text>
<rect x="365.0" y="344.0" width="108.0" height="29.0" rx="14" fill="#13345B" stroke="#36516F" stroke-width="1"/>
