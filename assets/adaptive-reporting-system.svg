<text x="1158.0" y="632.0" class="footnote" text-anchor="end">Route first · adapt the schema · preserve the evidence boundary</text>
<text x="600.0" y="632.0" class="micro" text-anchor="middle" style="fill:#8B98A9">HIGH-STAKES ANALYTICS &amp; DECISION LAB · EDITORIAL EVIDENCE SYSTEM</text>
